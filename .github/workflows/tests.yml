name: Tests

on:
    push:
        paths:
            - "backend/**"
    pull_request:
        paths:
            - "backend/**"

jobs:
    test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: modus_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - working-directory: backend
              run: npm ci
            - working-directory: backend
              run: npx prisma generate
            - working-directory: backend
              run: npx prisma migrate deploy
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/modus_test
            - working-directory: backend
              run: npm test
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/modus_test
                  JWT_ACCESS_SECRET: test-secret
                  JWT_REFRESH_SECRET: test-refresh-secret
