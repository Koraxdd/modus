name: Frontend Tests

on:
    push:
        paths:
            - "web/**"
            - ".github/workflows/frontend-tests.yml"
    pull_request:
        paths:
            - "web/**"
            - ".github/workflows/frontend-tests.yml"

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: web/package-lock.json
            - working-directory: web
              run: npm ci
            - working-directory: web
              run: npm test
